name: dicomxphits public CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint requirements/runtime.txt --constraint requirements/test.txt -e ".[test]"

      - name: Compile package
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/dicomxphits-pycache
        run: python -m compileall src

      - name: Run tests
        run: pytest tests -q -p no:cacheprovider

      - name: Verify public repository boundary
        run: python tools/verify_public_tree.py
