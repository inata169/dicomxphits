name: dicomxphits public CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Compile package
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/dicomxphits-pycache
        run: python -m compileall src

      - name: Run tests
        run: pytest tests -q -p no:cacheprovider

      - name: Verify public repository boundary
        run: python tools/verify_public_tree.py
