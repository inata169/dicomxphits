name: dicomxphits public CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint requirements/runtime.txt --constraint requirements/test.txt -e ".[test]"

      - name: Compile package
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/dicomxphits-pycache
        run: python -m compileall src

      - name: Run tests
        run: pytest tests -q -p no:cacheprovider

      - name: Verify public repository boundary
        run: python tools/verify_public_tree.py
